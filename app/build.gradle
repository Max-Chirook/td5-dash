plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mooo.hairyone.td5tester'
    compileSdk 35

    defaultConfig {
        // A separate id, so this can sit next to the original app for comparison.
        applicationId "com.mooo.hairyone.td5dash"
        minSdk 21
        targetSdk 34
        versionCode 16
        versionName "1.6"
    }

    // The release key lives outside the repo. Every version must be signed
    // with it, or Android refuses to install it over the previous one.
    def keyProps = new Properties()
    def keyFile = rootProject.file('keystore.properties')
    if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

    signingConfigs {
        if (keyFile.exists()) {
            release {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keyFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.github.jakob-grabner:Circle-Progress-View:v1.3'
    testImplementation 'junit:junit:4.13.2'
}
